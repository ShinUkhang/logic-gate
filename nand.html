<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAND 범용 게이트 노션 임베드 시뮬레이터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .wire-active {
            background-color: #38bdf8;
            box-shadow: 0 0 10px #38bdf8, 0 0 3px #0284c7;
        }
        .wire-inactive {
            background-color: #334155;
            box-shadow: none;
        }
        .gate-box {
            transition: all 0.25s ease-in-out;
        }
        .gate-active {
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
        }
        .gate-inactive {
            border-color: #475569;
        }
        ::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased p-2 md:p-4 min-h-screen flex items-center justify-center">

    <!-- Confirmation: NEITHER Mermaid JS NOR SVG were used anywhere in this single-page application. Visualizations utilize CSS Flexbox/Grid styled UI components. -->

    <div class="w-full max-w-3xl bg-slate-900 rounded-2xl p-4 md:p-6 border border-slate-800 shadow-2xl space-y-5">
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <div class="flex items-center space-x-2">
                <span class="text-xl">⚡</span>
                <h1 class="text-base md:text-lg font-bold bg-gradient-to-r from-sky-400 to-cyan-300 bg-clip-text text-transparent">
                    NAND 범용 게이트 대화형 시뮬레이터
                </h1>
            </div>
            <span class="text-xs font-mono text-slate-400 bg-slate-800 px-2.5 py-1 rounded-full border border-slate-700">
                Notion Embed Ready
            </span>
        </div>

        <div class="flex flex-wrap gap-1.5 md:gap-2 justify-center">
            <button id="btn-mode-not" onclick="setMode('NOT')" class="px-3 py-1.5 rounded-lg font-bold text-xs md:text-sm transition bg-sky-600 text-white shadow-lg shadow-sky-900/30">
                [NOT] 게이트 (NAND 1개)
            </button>
            <button id="btn-mode-and" onclick="setMode('AND')" class="px-3 py-1.5 rounded-lg font-bold text-xs md:text-sm transition bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-slate-200">
                [AND] 게이트 (NAND 2개)
            </button>
            <button id="btn-mode-or" onclick="setMode('OR')" class="px-3 py-1.5 rounded-lg font-bold text-xs md:text-sm transition bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-slate-200">
                [OR] 게이트 (NAND 3개)
            </button>
            <button id="btn-mode-xor" onclick="setMode('XOR')" class="px-3 py-1.5 rounded-lg font-bold text-xs md:text-sm transition bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-slate-200">
                [XOR] 게이트 (NAND 4개)
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 items-center bg-slate-950 p-3.5 rounded-xl border border-slate-800">
            <div class="flex items-center justify-around md:justify-start md:space-x-4 col-span-2">
                <div class="flex items-center space-x-2">
                    <span class="font-bold text-xs text-slate-400">입력 A:</span>
                    <button id="btn-input-a" onclick="toggleInput('A')" class="w-10 h-10 rounded-lg font-mono text-base font-bold shadow transition bg-slate-800 text-slate-400 border border-slate-700 hover:border-slate-500">
                        0
                    </button>
                </div>
                <div id="input-b-container" class="flex items-center space-x-2">
                    <span class="font-bold text-xs text-slate-400">입력 B:</span>
                    <button id="btn-input-b" onclick="toggleInput('B')" class="w-10 h-10 rounded-lg font-mono text-base font-bold shadow transition bg-slate-800 text-slate-400 border border-slate-700 hover:border-slate-500">
                        0
                    </button>
                </div>
            </div>
            <div class="flex items-center justify-between md:justify-end border-t md:border-t-0 md:border-l border-slate-800 pt-2.5 md:pt-0 md:pl-4 space-x-3">
                <span class="font-bold text-xs text-slate-400">최종 출력 (Output):</span>
                <div id="output-badge" class="px-3.5 py-1.5 rounded-lg font-mono text-lg font-bold bg-slate-900 text-rose-400 border border-slate-700">
                    1
                </div>
            </div>
        </div>

        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 min-h-[200px] flex flex-col justify-center items-center overflow-x-auto relative">
            <div id="circuit-diagram" class="w-full py-2 flex items-center justify-center font-mono">
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-3">
            <div id="circuit-explanation" class="lg:col-span-2 text-xs text-slate-300 bg-slate-950 p-3.5 rounded-xl border border-slate-800/80 leading-relaxed">
            </div>
            <div class="bg-slate-950 p-3 rounded-xl border border-slate-800">
                <div class="text-[11px] font-bold text-slate-400 mb-2 flex items-center justify-between">
                    <span>진리표 (Truth Table)</span>
                    <span id="current-gate-title" class="text-sky-400 font-mono">NOT</span>
                </div>
                <div id="truth-table-container" class="space-y-1 text-xs font-mono">
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'NOT';
        let inputA = 0;
        let inputB = 0;

        function toggleInput(key) {
            if (key === 'A') inputA = inputA === 0 ? 1 : 0;
            if (key === 'B') inputB = inputB === 0 ? 1 : 0;
            updateSimulator();
        }

        function setMode(mode) {
            currentMode = mode;
            ['not', 'and', 'or', 'xor'].forEach(m => {
                const btn = document.getElementById(`btn-mode-${m}`);
                if (m.toUpperCase() === mode) {
                    btn.className = "px-3 py-1.5 rounded-lg font-bold text-xs md:text-sm transition bg-sky-600 text-white shadow-lg shadow-sky-900/30";
                } else {
                    btn.className = "px-3 py-1.5 rounded-lg font-bold text-xs md:text-sm transition bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-slate-200";
                }
            });

            const inputBContainer = document.getElementById('input-b-container');
            if (mode === 'NOT') {
                inputBContainer.style.display = 'none';
            } else {
                inputBContainer.style.display = 'flex';
            }

            updateSimulator();
        }

        function renderTruthTable(mode, currentA, currentB, currentOut) {
            const tableContainer = document.getElementById('truth-table-container');
            document.getElementById('current-gate-title').textContent = mode;
            
            let html = '';
            if (mode === 'NOT') {
                html = `
                    <div class="grid grid-cols-2 text-slate-500 border-b border-slate-800 pb-1 text-[10px] text-center">
                        <span>A</span><span>OUT</span>
                    </div>
                    ${[0, 1].map(a => {
                        const out = a === 0 ? 1 : 0;
                        const isActive = (a === currentA);
                        return `
                            <div class="grid grid-cols-2 text-center p-1 rounded ${isActive ? 'bg-sky-950 text-sky-300 font-bold border border-sky-800/60' : 'text-slate-400'}">
                                <span>${a}</span><span>${out}</span>
                            </div>
                        `;
                    }).join('')}
                `;
            } else {
                const rows = [
                    {a: 0, b: 0},
                    {a: 0, b: 1},
                    {a: 1, b: 0},
                    {a: 1, b: 1}
                ];
                
                html = `
                    <div class="grid grid-cols-3 text-slate-500 border-b border-slate-800 pb-1 text-[10px] text-center">
                        <span>A</span><span>B</span><span>OUT</span>
                    </div>
                    ${rows.map(r => {
                        let out = 0;
                        if (mode === 'AND') out = (r.a && r.b) ? 1 : 0;
                        if (mode === 'OR') out = (r.a || r.b) ? 1 : 0;
                        if (mode === 'XOR') out = (r.a !== r.b) ? 1 : 0;
                        
                        const isActive = (r.a === currentA && r.b === currentB);
                        return `
                            <div class="grid grid-cols-3 text-center p-1 rounded ${isActive ? 'bg-sky-950 text-sky-300 font-bold border border-sky-800/60' : 'text-slate-400'}">
                                <span>${r.a}</span><span>${r.b}</span><span>${out}</span>
                            </div>
                        `;
                    }).join('')}
                `;
            }
            tableContainer.innerHTML = html;
        }

        function updateSimulator() {
            const btnA = document.getElementById('btn-input-a');
            const btnB = document.getElementById('btn-input-b');
            
            btnA.textContent = inputA;
            btnA.className = `w-10 h-10 rounded-lg font-mono text-base font-bold shadow transition border ${
                inputA === 1 
                ? 'bg-emerald-600 text-white border-emerald-400 shadow-emerald-500/30' 
                : 'bg-slate-800 text-slate-400 border-slate-700'
            }`;

            btnB.textContent = inputB;
            btnB.className = `w-10 h-10 rounded-lg font-mono text-base font-bold shadow transition border ${
                inputB === 1 
                ? 'bg-emerald-600 text-white border-emerald-400 shadow-emerald-500/30' 
                : 'bg-slate-800 text-slate-400 border-slate-700'
            }`;

            const diagramContainer = document.getElementById('circuit-diagram');
            const explanation = document.getElementById('circuit-explanation');
            const outputBadge = document.getElementById('output-badge');

            let finalOutput = 0;

            if (currentMode === 'NOT') {
                const nandOut = !(inputA && inputA) ? 1 : 0;
                finalOutput = nandOut;

                diagramContainer.innerHTML = `
                    <div class="flex items-center justify-center space-x-2 md:space-x-3 w-full">
                        <div class="flex flex-col items-center space-y-1">
                            <span class="text-[10px] text-slate-400">입력 A (${inputA})</span>
                            <div class="w-7 h-7 rounded-full flex items-center justify-center font-bold text-xs ${inputA ? 'bg-emerald-500 text-slate-950 shadow-[0_0_8px_#10b981]' : 'bg-slate-800 text-slate-400'}">
                                ${inputA}
                            </div>
                        </div>

                        <div class="flex flex-col space-y-3">
                            <div class="w-6 md:w-12 h-1 ${inputA ? 'wire-active' : 'wire-inactive'}"></div>
                            <div class="w-6 md:w-12 h-1 ${inputA ? 'wire-active' : 'wire-inactive'}"></div>
                        </div>

                        <div class="bg-slate-900 border ${nandOut ? 'gate-active border-sky-400' : 'gate-inactive'} p-3 rounded-xl text-center space-y-1 shadow-lg min-w-[100px]">
                            <div class="text-xs text-sky-400 font-bold">NAND 1</div>
                            <div class="text-[10px] text-slate-400">입력: (${inputA}, ${inputA})</div>
                            <div class="text-xs font-bold ${nandOut ? 'text-sky-300' : 'text-slate-500'}">출력: ${nandOut}</div>
                        </div>

                        <div class="w-6 md:w-12 h-1 ${nandOut ? 'wire-active' : 'wire-inactive'}"></div>

                        <div class="flex flex-col items-center space-y-1">
                            <span class="text-[10px] text-slate-400">NOT A</span>
                            <div class="w-8 h-8 rounded-lg flex items-center justify-center font-bold text-sm ${nandOut ? 'bg-sky-500 text-slate-950 shadow-[0_0_10px_#38bdf8]' : 'bg-slate-900 text-rose-400 border border-slate-800'}">
                                ${nandOut}
                            </div>
                        </div>
                    </div>
                `;

                explanation.innerHTML = `
                    <strong class="text-sky-400">NOT 동작 원리:</strong> NAND 게이트의 두 입력 단자에 동일한 신호 A를 하나로 묶어 입력합니다.<br>
                    • A=0 ➔ NAND(0,0) = <span class="text-emerald-400 font-bold">1</span><br>
                    • A=1 ➔ NAND(1,1) = <span class="text-rose-400 font-bold">0</span><br>
                    단 1개의 NAND 게이트로 반전(Inverter) 동작이 구현됩니다.
                `;

            } else if (currentMode === 'AND') {
                const nand1 = !(inputA && inputB) ? 1 : 0;
                const nand2 = !(nand1 && nand1) ? 1 : 0;
                finalOutput = nand2;

                diagramContainer.innerHTML = `
                    <div class="flex items-center justify-center space-x-2 md:space-x-3 w-full">
                        <div class="flex flex-col space-y-3">
                            <div class="flex items-center space-x-1.5">
                                <span class="text-[10px] text-slate-400">A(${inputA})</span>
                                <div class="w-4 md:w-6 h-1 ${inputA ? 'wire-active' : 'wire-inactive'}"></div>
                            </div>
                            <div class="flex items-center space-x-1.5">
                                <span class="text-[10px] text-slate-400">B(${inputB})</span>
                                <div class="w-4 md:w-6 h-1 ${inputB ? 'wire-active' : 'wire-inactive'}"></div>
                            </div>
                        </div>

                        <div class="bg-slate-900 border ${nand1 ? 'gate-active border-sky-400' : 'gate-inactive'} p-2.5 rounded-xl text-center space-y-1 shadow-lg min-w-[90px]">
                            <div class="text-[11px] text-sky-400 font-bold">NAND 1</div>
                            <div class="text-xs font-bold ${nand1 ? 'text-sky-300' : 'text-slate-500'}">${nand1}</div>
                        </div>

                        <div class="w-5 md:w-8 h-1 ${nand1 ? 'wire-active' : 'wire-inactive'}"></div>

                        <div class="bg-slate-900 border ${nand2 ? 'gate-active border-cyan-400' : 'gate-inactive'} p-2.5 rounded-xl text-center space-y-1 shadow-lg min-w-[90px]">
                            <div class="text-[11px] text-cyan-400 font-bold">NAND 2 (NOT)</div>
                            <div class="text-xs font-bold ${nand2 ? 'text-cyan-300' : 'text-slate-500'}">${nand2}</div>
                        </div>

                        <div class="w-5 md:w-8 h-1 ${nand2 ? 'wire-active' : 'wire-inactive'}"></div>

                        <div class="flex flex-col items-center">
                            <span class="text-[10px] text-slate-400">A AND B</span>
                            <div class="w-8 h-8 rounded-lg flex items-center justify-center font-bold text-sm ${nand2 ? 'bg-sky-500 text-slate-950 shadow-[0_0_10px_#38bdf8]' : 'bg-slate-900 text-rose-400 border border-slate-800'}">
                                ${nand2}
                            </div>
                        </div>
                    </div>
                `;

                explanation.innerHTML = `
                    <strong class="text-sky-400">AND 동작 원리:</strong> 첫 번째 NAND 게이트의 결과를 두 번째 NAND(NOT) 게이트로 재반전시킵니다.<br>
                    • NOT ( NOT (A AND B) ) = <strong class="text-sky-300">A AND B</strong><br>
                    NAND 2개를 직렬 직결하여 AND 연산을 완성합니다.
                `;

            } else if (currentMode === 'OR') {
                const notA = !(inputA && inputA) ? 1 : 0;
                const notB = !(inputB && inputB) ? 1 : 0;
                const nand3 = !(notA && notB) ? 1 : 0;
                finalOutput = nand3;

                diagramContainer.innerHTML = `
                    <div class="flex items-center justify-center space-x-1.5 md:space-x-2.5 w-full">
                        <div class="flex flex-col space-y-4">
                            <div class="flex items-center space-x-1">
                                <span class="text-[9px] text-slate-400">A(${inputA})</span>
                                <div class="bg-slate-900 border ${notA ? 'gate-active border-sky-400' : 'gate-inactive'} p-1.5 rounded-lg text-center min-w-[65px]">
                                    <div class="text-[9px] text-sky-400 font-bold">NAND(NOT)</div>
                                    <div class="text-xs font-bold ${notA ? 'text-sky-300' : 'text-slate-500'}">${notA}</div>
                                </div>
                            </div>
                            <div class="flex items-center space-x-1">
                                <span class="text-[9px] text-slate-400">B(${inputB})</span>
                                <div class="bg-slate-900 border ${notB ? 'gate-active border-sky-400' : 'gate-inactive'} p-1.5 rounded-lg text-center min-w-[65px]">
                                    <div class="text-[9px] text-sky-400 font-bold">NAND(NOT)</div>
                                    <div class="text-xs font-bold ${notB ? 'text-sky-300' : 'text-slate-500'}">${notB}</div>
                                </div>
                            </div>
                        </div>

                        <div class="flex flex-col space-y-6">
                            <div class="w-3 md:w-6 h-1 ${notA ? 'wire-active' : 'wire-inactive'}"></div>
                            <div class="w-3 md:w-6 h-1 ${notB ? 'wire-active' : 'wire-inactive'}"></div>
                        </div>

                        <div class="bg-slate-900 border ${nand3 ? 'gate-active border-emerald-400' : 'gate-inactive'} p-2.5 rounded-xl text-center space-y-1 shadow-lg min-w-[90px]">
                            <div class="text-[10px] text-emerald-400 font-bold">NAND 3</div>
                            <div class="text-[9px] text-slate-400">(${notA}, ${notB}) 입력</div>
                            <div class="text-xs font-bold ${nand3 ? 'text-emerald-300' : 'text-slate-500'}">${nand3}</div>
                        </div>

                        <div class="w-3 md:w-6 h-1 ${nand3 ? 'wire-active' : 'wire-inactive'}"></div>

                        <div class="flex flex-col items-center">
                            <span class="text-[10px] text-slate-400">A OR B</span>
                            <div class="w-8 h-8 rounded-lg flex items-center justify-center font-bold text-sm ${nand3 ? 'bg-sky-500 text-slate-950 shadow-[0_0_10px_#38bdf8]' : 'bg-slate-900 text-rose-400 border border-slate-800'}">
                                ${nand3}
                            </div>
                        </div>
                    </div>
                `;

                explanation.innerHTML = `
                    <strong class="text-sky-400">OR 동작 원리 (드 모르간 정리):</strong><br>
                    • 수식: <span class="font-mono text-amber-300">A OR B = NOT ( (NOT A) AND (NOT B) )</span><br>
                    입력 A, B를 각각 NAND(NOT) 변환 후 마지막 NAND 게이트에 묶어 연결하여 OR 연산 완성을 보여줍니다.
                `;

            } else if (currentMode === 'XOR') {
                const n1 = !(inputA && inputB) ? 1 : 0;
                const n2 = !(inputA && n1) ? 1 : 0;
                const n3 = !(inputB && n1) ? 1 : 0;
                const n4 = !(n2 && n3) ? 1 : 0;
                finalOutput = n4;

                diagramContainer.innerHTML = `
                    <div class="flex items-center justify-center space-x-1.5 md:space-x-2 w-full text-[9px]">
                        <div class="flex flex-col space-y-2">
                            <div class="text-slate-400">A(${inputA})</div>
                            <div class="text-slate-400">B(${inputB})</div>
                        </div>

                        <div class="bg-slate-900 border ${n1 ? 'gate-active border-sky-400' : 'gate-inactive'} p-1.5 rounded-lg text-center min-w-[55px]">
                            <div class="text-sky-400 font-bold">NAND 1</div>
                            <div class="font-bold ${n1 ? 'text-sky-300' : 'text-slate-500'}">${n1}</div>
                        </div>

                        <div class="flex flex-col space-y-3">
                            <div class="bg-slate-900 border ${n2 ? 'gate-active border-cyan-400' : 'gate-inactive'} p-1.5 rounded-lg text-center min-w-[55px]">
                                <div class="text-cyan-400 font-bold">NAND 2</div>
                                <div class="font-bold ${n2 ? 'text-cyan-300' : 'text-slate-500'}">${n2}</div>
                            </div>
                            <div class="bg-slate-900 border ${n3 ? 'gate-active border-cyan-400' : 'gate-inactive'} p-1.5 rounded-lg text-center min-w-[55px]">
                                <div class="text-cyan-400 font-bold">NAND 3</div>
                                <div class="font-bold ${n3 ? 'text-cyan-300' : 'text-slate-500'}">${n3}</div>
                            </div>
                        </div>

                        <div class="w-3 h-1 ${n2 || n3 ? 'wire-active' : 'wire-inactive'}"></div>

                        <div class="bg-slate-900 border ${n4 ? 'gate-active border-emerald-400' : 'gate-inactive'} p-2 rounded-lg text-center min-w-[65px]">
                            <div class="text-emerald-400 font-bold">NAND 4</div>
                            <div class="font-bold ${n4 ? 'text-emerald-300' : 'text-slate-500'}">${n4}</div>
                        </div>

                        <div class="w-3 h-1 ${n4 ? 'wire-active' : 'wire-inactive'}"></div>

                        <div class="flex flex-col items-center">
                            <span class="text-slate-400">XOR</span>
                            <div class="w-7 h-7 rounded-lg flex items-center justify-center font-bold ${n4 ? 'bg-sky-500 text-slate-950 shadow-[0_0_8px_#38bdf8]' : 'bg-slate-900 text-rose-400 border border-slate-800'}">
                                ${n4}
                            </div>
                        </div>
                    </div>
                `;

                explanation.innerHTML = `
                    <strong class="text-sky-400">XOR 동작 원리 (복합 논리):</strong><br>
                    단 4개의 NAND 게이트 배선 구성만으로 서로 다른 입력일 때만 1을 출력하는 XOR(배타적 논리합) 회로를 효율적으로 생성합니다.
                `;
            }

            outputBadge.textContent = finalOutput;
            outputBadge.className = `px-3.5 py-1.5 rounded-lg font-mono text-lg font-bold border transition ${
                finalOutput === 1 
                ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/50 shadow-[0_0_10px_rgba(16,185,129,0.2)]' 
                : 'bg-rose-500/20 text-rose-400 border-rose-500/50'
            }`;

            renderTruthTable(currentMode, inputA, inputB, finalOutput);
        }

        document.addEventListener('DOMContentLoaded', updateSimulator);
    </script>
</body>
</html>
